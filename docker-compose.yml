services:
  autocompare-db:
    container_name: autocompare-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autocompare_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d autocompare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
